<body>
  <div class="page" id="app">
    <div id="bannerMount"></div>

    <div class="section">
      <div class="card">
        <div class="card-title">验房基本信息</div>
        <div class="info-grid" id="baseInfoGrid"></div>
      </div>
    </div>

    <div class="section chart-grid">
      <div class="card">
        <div class="card-title">功能间问题占比</div>
        <div class="card-sub">各功能间问题数量及占比</div>
        <div class="chart-box" id="chartRoomPie"></div>
        <div class="stat-list" id="roomPieLegend"></div>
      </div>

      <div class="card">
        <div class="card-title">严重程度分布</div>
        <div class="card-sub">轻微 / 中等 / 严重</div>
        <div class="chart-box" id="chartSeverity"></div>
        <div class="stat-list" id="severityLegend"></div>
      </div>

      <div class="card span-2">
        <div class="card-title">功能间问题对比</div>
        <div class="card-sub">按严重程度堆叠 · 问题数量降序</div>
        <div class="chart-box tall" id="chartRoomStack"></div>
      </div>
    </div>

    <div class="section">
      <div class="card">
        <div class="card-title">问题明细</div>
        <div class="card-sub">按功能间列出全部问题项</div>
        <div id="detailMount"></div>
        <div class="empty" id="detailEmpty" style="display:none">暂无问题记录</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ROOM_COLORS = ["#4C8BF5", "#34C759", "#FF9F0A", "#AF52DE", "#5AC8FA", "#FF6259", "#8E8E93"];
      var SEV = {
        minor: { key: "minor", label: "轻微", color: "#67C23A" },
        moderate: { key: "moderate", label: "中等", color: "#E6A23C" },
        severe: { key: "severe", label: "严重", color: "#F56C6C" }
      };
      var HOUSE_TYPE = { hardcover: "精装", rough: "毛坯", simple: "简装" };

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pct(n, total) {
        if (!total) return "0%";
        var v = (n * 100) / total;
        return (Math.round(v * 10) / 10) + "%";
      }

      function aggregate(checklist) {
        var rooms = [];
        var severity = { minor: 0, moderate: 0, severe: 0 };
        var total = 0;

        (checklist || []).forEach(function (room) {
          var issues = room.issues || [];
          if (!issues.length) return;
          var counts = { minor: 0, moderate: 0, severe: 0 };
          issues.forEach(function (issue) {
            var k = SEV[issue.severity] ? issue.severity : "minor";
            counts[k] += 1;
            severity[k] += 1;
            total += 1;
          });
          rooms.push({
            name: room.name,
            total: issues.length,
            minor: counts.minor,
            moderate: counts.moderate,
            severe: counts.severe
          });
        });

        rooms.sort(function (a, b) { return b.total - a.total; });
        return { rooms: rooms, severity: severity, total: total };
      }

      function renderBanner(data) {
        var mount = document.getElementById("bannerMount");
        var url = data && data.pdfInfo && data.pdfInfo.bannerUrl;
        if (!url) {
          mount.innerHTML = '<div class="banner-fallback">验房报告</div>';
          return;
        }
        mount.innerHTML = '<img class="banner" alt="banner" src="' + esc(url) + '" />';
        var img = mount.querySelector("img");
        img.onerror = function () {
          mount.innerHTML = '<div class="banner-fallback">验房报告</div>';
        };
      }

      function renderBaseInfo(base) {
        base = base || {};
        var items = [
          ["楼盘名称", base.estateName],
          ["房号", base.unitNo],
          ["面积", base.area ? base.area + " ㎡" : ""],
          ["户型", base.layout],
          ["装修类型", HOUSE_TYPE[base.houseType] || base.houseType || ""],
          ["验房日期", base.inspectDate],
          ["业主", base.ownerName],
          ["联系电话", base.ownerPhone]
        ];
        document.getElementById("baseInfoGrid").innerHTML = items.map(function (pair) {
          return (
            '<div class="info-item">' +
              '<div class="label">' + esc(pair[0]) + '</div>' +
              '<div class="value">' + esc(pair[1] || "-") + '</div>' +
            '</div>'
          );
        }).join("");
      }

      function renderStatList(el, rows) {
        el.innerHTML = rows.map(function (r) {
          return (
            '<div class="stat-row">' +
              '<span class="name"><span class="dot" style="background:' + r.color + '"></span>' + esc(r.name) + '</span>' +
              '<span class="meta">' + esc(r.meta) + '</span>' +
            '</div>'
          );
        }).join("");
      }

      function initPie(rooms, total) {
        var el = document.getElementById("chartRoomPie");
        var chart = echarts.init(el, null, { renderer: "svg" });
        var seriesData = rooms.map(function (r, i) {
          return {
            name: r.name,
            value: r.total,
            itemStyle: { color: ROOM_COLORS[i % ROOM_COLORS.length] }
          };
        });

        chart.setOption({
          animation: false,
          tooltip: { show: false },
          legend: { show: false },
          series: [{
            type: "pie",
            radius: ["42%", "68%"],
            center: ["50%", "50%"],
            avoidLabelOverlap: true,
            label: {
              formatter: "{b}:{c}处",
              fontSize: 11,
              color: "#242a33"
            },
            labelLine: { length: 10, length2: 8 },
            data: seriesData.length ? seriesData : [{ name: "暂无", value: 0, itemStyle: { color: "#d0d3d9" } }]
          }],
          graphic: [{
            type: "group",
            left: "center",
            top: "middle",
            children: [
              {
                type: "text",
                style: {
                  text: String(total),
                  fill: "#12151a",
                  fontSize: 28,
                  fontWeight: 700,
                  align: "center",
                  textAlign: "center"
                },
                top: -14
              },
              {
                type: "text",
                style: {
                  text: "问题总数",
                  fill: "#3e4652",
                  fontSize: 12,
                  align: "center",
                  textAlign: "center"
                },
                top: 16
              }
            ]
          }]
        });

        renderStatList(
          document.getElementById("roomPieLegend"),
          rooms.map(function (r, i) {
            return {
              name: r.name,
              color: ROOM_COLORS[i % ROOM_COLORS.length],
              meta: r.total + "处 (" + pct(r.total, total) + ")"
            };
          })
        );
      }

      function initStack(rooms) {
        var el = document.getElementById("chartRoomStack");
        var chart = echarts.init(el, null, { renderer: "svg" });
        var names = rooms.map(function (r) { return r.name; });
        var minor = rooms.map(function (r) { return r.minor; });
        var moderate = rooms.map(function (r) { return r.moderate; });
        var severe = rooms.map(function (r) { return r.severe; });
        var totals = rooms.map(function (r) { return r.total; });
        var maxY = Math.max.apply(null, totals.concat([1]));

        chart.setOption({
          animation: false,
          tooltip: { show: false },
          legend: {
            top: 0,
            right: 0,
            itemWidth: 10,
            itemHeight: 10,
            textStyle: { fontSize: 11, color: "#2a3038" },
            data: [
              { name: "轻微", itemStyle: { color: SEV.minor.color } },
              { name: "中等", itemStyle: { color: SEV.moderate.color } },
              { name: "严重", itemStyle: { color: SEV.severe.color } }
            ]
          },
          grid: { left: 36, right: 12, top: 36, bottom: 28 },
          xAxis: {
            type: "category",
            data: names,
            axisTick: { show: false },
            axisLine: { lineStyle: { color: "#e5e6eb" } },
            axisLabel: {
              color: "#2a3038",
              fontSize: 11,
              interval: 0,
              rotate: names.length > 4 ? 30 : 0
            }
          },
          yAxis: {
            type: "value",
            minInterval: 1,
            max: maxY,
            splitLine: { lineStyle: { type: "dashed", color: "#e5e6eb" } },
            axisLabel: { color: "#3e4652", fontSize: 11 }
          },
          series: [
            {
              name: "轻微",
              type: "bar",
              stack: "sev",
              barMaxWidth: 36,
              itemStyle: { color: SEV.minor.color },
              label: {
                show: true,
                position: "inside",
                formatter: function (p) { return p.value > 0 ? p.value : ""; },
                color: "#fff",
                fontSize: 11
              },
              data: minor
            },
            {
              name: "中等",
              type: "bar",
              stack: "sev",
              barMaxWidth: 36,
              itemStyle: { color: SEV.moderate.color },
              label: {
                show: true,
                position: "inside",
                formatter: function (p) { return p.value > 0 ? p.value : ""; },
                color: "#fff",
                fontSize: 11
              },
              data: moderate
            },
            {
              name: "严重",
              type: "bar",
              stack: "sev",
              barMaxWidth: 36,
              itemStyle: { color: SEV.severe.color },
              label: {
                show: true,
                position: "inside",
                formatter: function (p) { return p.value > 0 ? p.value : ""; },
                color: "#fff",
                fontSize: 11
              },
              data: severe,
              markPoint: {
                symbol: "circle",
                symbolSize: 0.1,
                label: {
                  show: true,
                  formatter: function (p) { return totals[p.dataIndex]; },
                  color: "#12151a",
                  fontSize: 12,
                  fontWeight: 600,
                  position: "top",
                  distance: 6
                },
                data: totals.map(function (t, i) {
                  return { coord: [i, t], value: t };
                })
              }
            }
          ]
        });
      }

      function initSeverity(severity, total) {
        var el = document.getElementById("chartSeverity");
        var chart = echarts.init(el, null, { renderer: "svg" });
        var order = [SEV.minor, SEV.moderate, SEV.severe];
        var values = order.map(function (s) { return severity[s.key] || 0; });
        var maxX = Math.max.apply(null, values.concat([1]));

        chart.setOption({
          animation: false,
          tooltip: { show: false },
          grid: { left: 48, right: 28, top: 12, bottom: 28 },
          xAxis: {
            type: "value",
            min: 0,
            max: maxX,
            minInterval: 1,
            splitLine: { lineStyle: { color: "#eceff3" } },
            axisLabel: { color: "#3e4652", fontSize: 11 }
          },
          yAxis: {
            type: "category",
            data: order.map(function (s) { return s.label; }),
            inverse: true,
            axisTick: { show: false },
            axisLine: { show: false },
            axisLabel: { color: "#2a3038", fontSize: 12 }
          },
          series: [{
            type: "bar",
            barMaxWidth: 18,
            data: values.map(function (v, i) {
              return { value: v, itemStyle: { color: order[i].color, borderRadius: [0, 4, 4, 0] } };
            }),
            label: {
              show: true,
              position: "right",
              color: "#12151a",
              fontSize: 12
            }
          }]
        });

        renderStatList(
          document.getElementById("severityLegend"),
          order.map(function (s) {
            var n = severity[s.key] || 0;
            return {
              name: s.label,
              color: s.color,
              meta: n + "处 (" + pct(n, total) + ")"
            };
          })
        );
      }

      function renderImages(images) {
        var list = (images || []).filter(function (img) { return img && img.url; });
        if (!list.length) return '<span class="img-empty">-</span>';
        return (
          '<div class="img-row">' +
          list.map(function (img) {
            return '<img src="' + esc(img.url) + '" alt="" />';
          }).join("") +
          "</div>"
        );
      }

      function renderTable(checklist) {
        var mount = document.getElementById("detailMount");
        var empty = document.getElementById("detailEmpty");
        var blocks = [];

        (checklist || []).forEach(function (room) {
          var issues = room.issues || [];
          if (!issues.length) return;
          var rows = issues.map(function (issue, i) {
            var sev = SEV[issue.severity] || SEV.minor;
            return (
              "<tr>" +
                '<td class="col-idx">' + (i + 1) + "</td>" +
                '<td><div class="desc-text">' + esc(issue.description || "") + "</div></td>" +
                '<td class="col-img">' + renderImages(issue.images) + "</td>" +
                "<td>" + esc(issue.suggestion || "-") + "</td>" +
                '<td class="col-sev"><span class="tag tag-' + sev.key + '">' + esc(sev.label) + "</span></td>" +
              "</tr>"
            );
          });
          blocks.push(
            '<section class="room-block">' +
              '<div class="room-head">' +
                '<div class="room-name">' + esc(room.name) + "</div>" +
                '<div class="room-count">' + issues.length + " 项</div>" +
              "</div>" +
              '<div class="table-wrap">' +
                '<table class="detail">' +
                  "<thead><tr>" +
                    '<th class="col-idx">#</th>' +
                    "<th>问题描述</th>" +
                    '<th class="col-img">现场图片</th>' +
                    "<th>整改建议</th>" +
                    '<th class="col-sev">严重程度</th>' +
                  "</tr></thead>" +
                  "<tbody>" + rows.join("") + "</tbody>" +
                "</table>" +
              "</div>" +
            "</section>"
          );
        });

        if (!blocks.length) {
          mount.innerHTML = "";
          empty.style.display = "block";
          return;
        }
        empty.style.display = "none";
        mount.innerHTML = blocks.join("");
      }

      function main() {
        var data = window.__REPORT_DATA__ || {};
        renderBanner(data);
        renderBaseInfo(data.baseInfo);
        var stats = aggregate(data.checklist);
        if (typeof echarts === "undefined") {
          document.getElementById("chartRoomPie").innerHTML =
            '<div class="empty">图表库加载失败</div>';
        } else {
          initPie(stats.rooms, stats.total);
          initStack(stats.rooms);
          initSeverity(stats.severity, stats.total);
        }
        renderTable(data.checklist);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", main);
      } else {
        main();
      }
    })();
  </script>
</body>
</html>
